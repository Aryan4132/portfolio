<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — Aryan Shukla</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #030712;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2.5rem;
        border-radius: 1rem;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 4rem;
        margin: 0;
        color: #38bdf8;
        font-family: monospace;
      }
      h2 {
        font-size: 1.5rem;
        margin: 0.5rem 0 1rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        background: linear-gradient(to right, #06b6d4, #4f46e5);
        color: #ffffff;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s, opacity 0.2s;
      }
      a:hover {
        opacity: 0.9;
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Signal Lost / Page Not Found</h2>
      <p>The requested route does not exist or has been relocated within the workspace grid.</p>
      <a href="/">Return to Main Workspace</a>
    </div>
  </body>
</html>
