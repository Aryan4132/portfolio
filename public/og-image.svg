    <text x="130" y="467" fill="#38bdf8">Meridian-X Desktop</text>

    <!-- Pill 2 -->
    <rect x="320" y="440" width="220" height="44" rx="12" fill="#030712" stroke="#6366f1" stroke-opacity="0.3" />
