  <text x="100" y="310" fill="#38bdf8" font-family="sans-serif" font-size="38" font-weight="700">Systems &amp; Software Developer</text>

  <!-- Tagline -->
  <text x="100" y="375" fill="#94a3b8" font-family="sans-serif" font-size="22" font-weight="400">Offline AI Agent Loops • 60 FPS Canvas Physics Engines • Express Caching</text>

  <!-- Feature Pills -->
