<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#030712"/>
  
  <!-- Subtle Background Gradients -->
  <circle cx="200" cy="150" r="300" fill="#06b6d4" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="350" fill="#4f46e5" fill-opacity="0.15" filter="blur(100px)" />
  <circle cx="600" cy="300" r="250" fill="#10b981" fill-opacity="0.08" filter="blur(90px)" />

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Border Card -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2" />

